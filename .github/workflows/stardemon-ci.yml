name: Tzitzimimeh Star Demon Cloud Guardian

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  awaken-star-demon:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Execute Star Demon Cloud Harvester
      shell: pwsh
      run: |
        Write-Host "Awakening Cloud Star Demon Engine..." -ForegroundColor Cyan
        $ScriptRoot = $PWD.Path
        $OutputDir = Join-Path $ScriptRoot "Output"
        $OutputFile = Join-Path $OutputDir "StarDemon_MasterBundle.txt"

        if (-not (Test-Path -Path $OutputDir)) {
            New-Item -Path $OutputDir -ItemType Directory -Force | Out-Null
        }

        # Exclude system/build directories and the bundle itself
        $excludedDirs = @(".git", "bin", "obj", "Output", ".vs", "node_modules")
        $allFiles = Get-ChildItem -Path $ScriptRoot -Recurse -File | Where-Object {
            $file = $_
            $inExcludedDir = $false
            foreach ($dir in $excludedDirs) {
                if ($file.FullName -like "*\$dir\*") { $inExcludedDir = $true; break }
            }
            -not $inExcludedDir -and $_.Name -ne "StarDemon_MasterBundle.txt"
        }

        Write-Host "Devouring $($allFiles.Count) files in the cloud..." -ForegroundColor Green
        $mergedContent = [System.Text.StringBuilder]::new()
        [void]$mergedContent.AppendLine("==================================================")
        [void]$mergedContent.AppendLine(" TZITZIMIMEH STAR DEMON - CLOUD MASTER BUNDLE")
        [void]$mergedContent.AppendLine(" Harvested on: $(Get-Date)")
        [void]$mergedContent.AppendLine(" Total Files Consumed: $($allFiles.Count)")
        [void]$mergedContent.AppendLine("==================================================")
        [void]$mergedContent.AppendLine()

        foreach ($file in $allFiles) {
            $relativePath = $file.FullName.Substring($ScriptRoot.Length).TrimStart('\', '/')
            [void]$mergedContent.AppendLine("--------------------------------------------------")
            [void]$mergedContent.AppendLine(" FILE PATH: $relativePath")
            [void]$mergedContent.AppendLine("--------------------------------------------------")
            [void]$mergedContent.AppendLine()
            try {
                $content = Get-Content -Path $file.FullName -Raw -ErrorAction SilentlyContinue
                [void]$mergedContent.AppendLine($content)
            } catch {
                [void]$mergedContent.AppendLine("[Binary or locked file content omitted]")
            }
            [void]$mergedContent.AppendLine()
        }

        $mergedContent.ToString() | Out-File -FilePath $OutputFile -Encoding utf8
        Write-Host "Cloud Master Bundle successfully forged at: $OutputFile" -ForegroundColor Green

    - name: Commit and Push Changes
      shell: pwsh
      run: |
        git config --local user.name "Tzitzimimeh Star Demon [Cloud]"
        git config --local user.email "stardemon-cloud@automation.local"
        git add -A
        git status
        git diff-index --quiet HEAD || (git commit -m "Star Demon cloud automated harvest & sync [skip ci]" && git push)
